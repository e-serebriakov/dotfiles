# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''
    # Disable cmd+m minimize
    cmd-m = 'exec-and-forget true'

    # Layout
    cmd-ctrl-alt-shift-slash = 'layout tiles horizontal vertical'
    cmd-ctrl-alt-shift-comma = 'layout accordion horizontal vertical'

    # Focus
    cmd-ctrl-alt-shift-h = 'focus left'
    cmd-ctrl-alt-shift-j = 'focus down'
    cmd-ctrl-alt-shift-k = 'focus up'
    cmd-ctrl-alt-shift-l = 'focus right'

    # Resize
    cmd-ctrl-alt-shift-minus = 'resize smart -50'
    cmd-ctrl-alt-shift-equal = 'resize smart +50'

    # Workspaces
    cmd-ctrl-alt-shift-1 = 'workspace 1'
    cmd-ctrl-alt-shift-2 = 'workspace 2'
    cmd-ctrl-alt-shift-3 = 'workspace 3'
    cmd-ctrl-alt-shift-4 = 'workspace 4'
    cmd-ctrl-alt-shift-5 = 'workspace 5'
    cmd-ctrl-alt-shift-6 = 'workspace 6'
    cmd-ctrl-alt-shift-7 = 'workspace 7'
    cmd-ctrl-alt-shift-8 = 'workspace 8'
    cmd-ctrl-alt-shift-9 = 'workspace 9'
    cmd-ctrl-alt-shift-a = 'workspace A'
    cmd-ctrl-alt-shift-b = 'workspace B'
    cmd-ctrl-alt-shift-c = 'workspace C'
    cmd-ctrl-alt-shift-d = 'workspace D'
    cmd-ctrl-alt-shift-e = 'workspace E'
    cmd-ctrl-alt-shift-f = 'workspace F'
    cmd-ctrl-alt-shift-g = 'workspace G'
    cmd-ctrl-alt-shift-i = 'workspace I'
    cmd-ctrl-alt-shift-m = 'workspace M'
    cmd-ctrl-alt-shift-n = 'workspace N'
    cmd-ctrl-alt-shift-o = 'workspace O'
    cmd-ctrl-alt-shift-p = 'workspace P'
    cmd-ctrl-alt-shift-q = 'workspace Q'
    cmd-ctrl-alt-shift-r = 'workspace R'
    cmd-ctrl-alt-shift-s = 'workspace S'
    cmd-ctrl-alt-shift-t = 'workspace T'
    cmd-ctrl-alt-shift-u = 'workspace U'
    cmd-ctrl-alt-shift-v = 'workspace V'
    cmd-ctrl-alt-shift-w = 'workspace W'
    cmd-ctrl-alt-shift-x = 'workspace X'
    cmd-ctrl-alt-shift-y = 'workspace Y'
    cmd-ctrl-alt-shift-z = 'workspace Z'

    # Workspace back-and-forth
    cmd-ctrl-alt-shift-tab = 'workspace-back-and-forth'

    # Enter move mode
    cmd-ctrl-alt-shift-space = 'mode move'

    # Service mode
    cmd-ctrl-alt-shift-semicolon = 'mode service'

# 'move' binding mode — entered via hyper+space
[mode.move.binding]
    esc = 'mode main'

    # Move window
    h = ['move left', 'mode main']
    j = ['move down', 'mode main']
    k = ['move up', 'mode main']
    l = ['move right', 'mode main']

    # Move node to workspace
    1 = ['move-node-to-workspace 1', 'mode main']
    2 = ['move-node-to-workspace 2', 'mode main']
    3 = ['move-node-to-workspace 3', 'mode main']
    4 = ['move-node-to-workspace 4', 'mode main']
    5 = ['move-node-to-workspace 5', 'mode main']
    6 = ['move-node-to-workspace 6', 'mode main']
    7 = ['move-node-to-workspace 7', 'mode main']
    8 = ['move-node-to-workspace 8', 'mode main']
    9 = ['move-node-to-workspace 9', 'mode main']
    a = ['move-node-to-workspace A', 'mode main']
    b = ['move-node-to-workspace B', 'mode main']
    c = ['move-node-to-workspace C', 'mode main']
    d = ['move-node-to-workspace D', 'mode main']
    e = ['move-node-to-workspace E', 'mode main']
    f = ['move-node-to-workspace F', 'mode main']
    g = ['move-node-to-workspace G', 'mode main']
    i = ['move-node-to-workspace I', 'mode main']
    m = ['move-node-to-workspace M', 'mode main']
    n = ['move-node-to-workspace N', 'mode main']
    o = ['move-node-to-workspace O', 'mode main']
    p = ['move-node-to-workspace P', 'mode main']
    q = ['move-node-to-workspace Q', 'mode main']
    r = ['move-node-to-workspace R', 'mode main']
    s = ['move-node-to-workspace S', 'mode main']
    t = ['move-node-to-workspace T', 'mode main']
    u = ['move-node-to-workspace U', 'mode main']
    v = ['move-node-to-workspace V', 'mode main']
    w = ['move-node-to-workspace W', 'mode main']
    x = ['move-node-to-workspace X', 'mode main']
    y = ['move-node-to-workspace Y', 'mode main']
    z = ['move-node-to-workspace Z', 'mode main']

    tab = ['move-workspace-to-monitor --wrap-around next', 'mode main']

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']
    cmd-w = ['close --quit-if-last-window', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

[[on-window-detected]]
    if.app-id = 'com.github.wez.wezterm'
    run = 'move-node-to-workspace T' # mnemonics T - Terminal

[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = 'move-node-to-workspace O' # mnemonics T - Terminal