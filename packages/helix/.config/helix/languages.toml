# Global settings only. Select project servers, such as TypeScript or Tailwind, in the project's .helix/languages.toml.

# Helix's defaults omit .bb files and bb.edn roots.
[[language]]
name = "clojure"
file-types = ["clj", "cljs", "cljc", "edn", "bb"]
roots = ["deps.edn", "project.clj", "bb.edn"]
auto-format = true

# prettierd uses the file name only to select a parser. A relative path is sufficient.
[[language]]
name = "html"
formatter = { command = "prettierd", args = ["%{buffer_name}"] }

[[language]]
name = "yaml"
formatter = { command = "prettierd", args = ["%{buffer_name}"] }

[[language]]
name = "markdown"
soft-wrap.enable = true
