# Grey — a low-contrast light theme for Helix
# Ported from Yorick Peterse’s Neovim “Grey”.
# Notes:
# - Diagnostics use colored, single-line underlines (like Vim’s sp+underline).
# - Selection/search-like emphasis uses soft light greys / yellows.
# - CSS/JSON/markup hints mapped to Helix Tree-sitter scopes.

###############
# UI (editor)
###############

"ui.background"            = { fg = "black", bg = "background" }    # Normal
"ui.background.separator"  = { fg = "border" }                       # WinSeparator/VertSplit
"ui.text"                  = { fg = "black", bg = "background" }
"ui.text.inactive"         = { fg = "black", bg = "grey_bg_light" }
"ui.text.directory"        = { fg = "purple" }                       # Directory
"ui.text.info"             = { fg = "black" }

"ui.window"                = { fg = "border" }                       # split borders
"ui.help"                  = { fg = "black", bg = "background" }

"ui.statusline"            = { fg = "black", bg = "background" }     # StatusLine
"ui.statusline.inactive"   = { fg = "black", bg = "grey_bg_light" }  # StatusLineNC
"ui.statusline.normal"     = { fg = "black", bg = "background", modifiers = ["bold"] } # active tab feel

"ui.bufferline"            = { fg = "black", bg = "light_grey" }     # TabLine
"ui.bufferline.active"     = { fg = "black", bg = "background", modifiers = ["bold"] } # TabLineSel
"ui.bufferline.background" = { fg = "black", bg = "light_grey" }     # TabLineFill

"ui.cursor"                = { fg = "background", bg = "black" }     # Cursor
"ui.cursor.match"          = { bg="light_grey", modifiers = ["bold"] }                # MatchParen → bold

"ui.cursorline.primary"    = { bg = "grey_bg_light" }
"ui.cursorline.secondary"  = { bg = "grey_bg_light" }

"ui.selection"             = { bg = "light_grey" }                   # Visual
"ui.selection.primary"     = { bg = "medium_grey" }

"ui.virtual.whitespace"    = { fg = "border" }                       # Whitespace
"ui.virtual.indent-guide"  = { fg = "border" }
"ui.virtual.inlay-hint"    = { fg = "grey", bg = "background" }
"ui.virtual.jump-label"    = { fg = "black", bg = "yellow", modifiers = ["bold"] } # Hop/Flash-like labels

"ui.linenr"                = { fg = "grey" }                         # LineNr
"ui.linenr.selected"       = { fg = "black", modifiers = ["bold"] }  # CursorLineNr

"ui.menu"                  = { fg = "black", bg = "grey_bg_light" }  # Pmenu
"ui.menu.selected"         = { fg = "black", bg = "light_grey", modifiers = ["bold"] } # PmenuSel
"ui.menu.scroll"           = { fg = "grey", bg = "grey_bg_light" }


"ui.popup"                 = { fg = "black", bg = "background" }     # NormalFloat
"ui.popup.info"            = { fg = "black", bg = "background" }     # prompts
"ui.picker.header"         = { fg = "black", bg = "background", modifiers = ["bold"] } # Title/FloatTitle
"ui.highlight"             = { modifiers = ["bold"] }                # general emphasis (used in previews)

################
# Diagnostics
################

"diagnostic"          = { } # fallback
"diagnostic.error"    = { fg = "red",        modifiers = ["bold"], underline = { color = "red",        style = "line" } }
"diagnostic.warning"  = { fg = "dark_yellow",modifiers = ["bold"], underline = { color = "dark_yellow",style = "line" } }
"diagnostic.info"     = { fg = "blue",       modifiers = ["bold"], underline = { color = "blue",       style = "line" } }
"diagnostic.hint"     = { fg = "grey",       modifiers = ["bold"], underline = { color = "grey",       style = "line" } }
"diagnostic.deprecated" = { underline = { style = "double_line", color = "grey" } }  # subtle cue

########
# Diff
########

"diff.plus"                 = { bg = "light_green", fg = "green" }         # DiffAdd
"diff.plus.gutter"          = { fg = "border" }
"diff.delta"                = { bg = "highlight_col", fg = "dark_yellow" } # DiffChange
"diff.delta.gutter"         = { fg = "border" }
"diff.minus"                = { fg = "black", bg = "light_red" }      # DiffDelete
"diff.minus.gutter"         = { fg = "border" }

#####################
# Syntax (Tree-sitter)
#####################

# Core
"comment"                   = { fg = "grey" }
"keyword"                   = { fg = "black", modifiers = ["bold"] }           # Keyword/Include/StorageClass
"keyword.control"           = { fg = "black", modifiers = ["bold"] }
"keyword.directive"         = { fg = "black", modifiers = ["bold"] }           # PreProc
"operator"                  = { fg = "black" }
"punctuation"               = { fg = "black" }

"constant"                  = { fg = "black" }                                  # Constant
"constant.numeric"          = { fg = "blue" }                                   # Number
"constant.character"        = { fg = "green" }                                  # Character→String
"constant.boolean"          = { fg = "black", modifiers = ["bold"] }            # Boolean→Keyword link
"constant.builtin"          = { fg = "black", modifiers = ["bold"] }

"string"                    = { fg = "green" }                                  # String
"string.regexp"             = { fg = "orange" }                                 # Regexp
"string.special"            = { fg = "orange" }                                 # Symbol/URI/etc.

"type"                      = { fg = "black" }                                  # Type (vim linked to Constant)
"type.builtin"              = { fg = "black", modifiers = ["bold"] }
"label"                     = { fg = "black", modifiers = ["bold"] }

"function"                  = { fg = "black" }                                  # Function
"function.builtin"          = { fg = "black", modifiers = ["bold"] }
"function.macro"            = { fg = "orange" }                                 # Macro

"variable"                  = { fg = "black" }                                  # Identifier
"variable.builtin"          = { fg = "black", modifiers = ["bold"] }            # @variable.builtin
"variable.parameter"        = { fg = "orange" }                                  # @variable.parameter.reference
"variable.other.member"     = { fg = "black" }                                  # InstanceVariable

"namespace"                 = { fg = "purple" }
"property"                  = { fg = "black" }
"attribute"                 = { fg = "black" }
"symbol"                    = { fg = "orange" }

# Tags / markup
"tag"                       = { fg = "black", modifiers = ["bold"] }            # htmlTagName bold
"tag.builtin"               = { fg = "black", modifiers = ["bold"] }

"markup.heading"            = { fg = "black", modifiers = ["bold"] }            # Title
"markup.bold"               = { modifiers = ["bold"] }                           # @text.strong
"markup.italic"             = { modifiers = ["italic"] }                         # @text.emphasis
"markup.link.url"           = { fg = "blue" }                                    # @markup.link / @text.uri
"markup.link.text"          = { fg = "green", modifiers = ["bold"] }             # gitcommit link text → bold green
"markup.list"               = { fg = "black", modifiers = ["bold"] }             # list markers → Keyword feel
"markup.quote"              = { fg = "grey" }
"markup.raw"                = { fg = "grey" }                                    # code blocks mapped to Comment-ish
"markup.strikethrough"      = { fg = "grey" }

# JSON/CSS hints from the source theme
"constant.other.json"       = { modifiers = ["bold"] }                           # @property.json bold-ish
"tag.css"                   = { fg = "black", modifiers = ["bold"] }             # cssTagName
"type.css"                  = { fg = "black", modifiers = ["bold"] }             # cssClassName
"variable.other.css"        = { fg = "purple" }                                  # cssCustomProp
"constant.css"              = { fg = "black", modifiers = ["bold"] }

########################
# Palette (exact colors)
########################
[palette]
background     = "#f2f2f2"
grey_bg_light  = "#ececec"
black          = "#000000"
blue           = "#1561b8"
green          = "#1C5708"
light_green    = "#dfeacc"
light_red      = "#f2d3cd"
red            = "#c4331d"
grey           = "#5e5e5e"
medium_grey    = "#b0b0b0"
light_grey     = "#e6e6e6"
border         = "#cccccc"
highlight_col  = "#eeeeee"
dark_yellow    = "#b37f02"
yellow         = "#f9db70"
light_yellow   = "#f9eab3"
orange         = "#a55000"
purple         = "#5c21a5"
white          = "#ffffff"
cyan           = "#007872"

