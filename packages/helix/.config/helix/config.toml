theme = "baked"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
mouse = false
auto-format = true
popup-border = "all"
bufferline = "multiple"
end-of-line-diagnostics = "hint"
# Yank to the system clipboard, as Neovim does with clipboard=unnamedplus.
default-yank-register = "+"
trim-trailing-whitespace = true
trim-final-newlines = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true

# Rex must send focus events to the pane. Otherwise focus-lost never fires.
[editor.auto-save]
focus-lost = true

[editor.statusline]
separator = "│"
mode.normal = "nor"
mode.insert = "ins"
mode.select = "sel"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false

# Space t r reloads buffers after the agent pane edits files. Helix does not reload them automatically.
# Space t e and Space t l type the code into the REPL pane of this Rex session. rex send reads REX_SESSION.
# awk 1 ends the text with a line end, so the REPL evaluates it. Helix shows no error when a failed command
# writes to stderr, so 2>/dev/null discards the Rex message. A missing pane then shows "Shell command failed: status 3".
[keys.normal.space.t]
e = ":pipe-to awk 1 | rex send -b REPL 2>/dev/null"
r = ":reload-all"
l = ["extend_to_line_bounds", ":pipe-to awk 1 | rex send -b REPL 2>/dev/null"]
# Space t a types @file:start-end of the selection into the agent pane and focuses it.
# Helix has no IDE integration.
a = ":sh printf '@%%s:%%s-%%s ' %{buffer_name} %{selection_line_start} %{selection_line_end} | rex send -b agent 2>/dev/null && rex focus agent"
# Space t b runs the current .bru request in a popup. bru must run from the collection root, so go up to bruno.json.
# It uses the local or localhost environment when the collection has one. The popup closes when its command exits, so less keeps the output.
# On a machine without sudo for /etc/hosts, ~/.local/share/node/localhost-dns.cjs lets Node resolve *.localhost hosts.
# The file isn't in the dotfiles. The binding loads it only when it exists.
# bru prints only a summary, so the response of each request comes from its JSON report, followed by the summary.
# grep drops the "failed to copy trust settings" lines that bru prints for each system certificate it can't read.
b = ":sh rex do popup cmd='f=$(realpath \"%{buffer_name}\"); cd \"${f%%/*}\"; until [ -f bruno.json ] || [ $PWD = / ]; do cd ..; done; for e in local localhost; do [ -f environments/$e.bru ] && set -- --env $e && break; done; p=$HOME/.local/share/node/localhost-dns.cjs; [ -f $p ] && export NODE_OPTIONS=\"--require $p\"; r=$(mktemp); FORCE_COLOR=1 bru run \"$f\" \"$@\" --reporter-json $r > $r.log 2>&1; { jq -C \".[0].results[] | {request: (.request.method + \\\" \\\" + .request.url), status: .response.status, data: .response.data}\" $r; grep -v \"trust settings\" $r.log; } | less -R'"

# Space v b shows the commit of the cursor line: hash, author, date, and subject. It blames the file on disk.
# An uncommitted line has the all-zero hash, which git log can't show.
[keys.normal.space.v]
b = ":sh c=$(git blame --porcelain -L %{cursor_line},+1 -- %{buffer_name} | head -1 | cut -d' ' -f1); case $c in 0000*) echo 'Not committed yet' ;; *) git log -1 --format='%%h · %%an, %%ar%%n%%s' $c ;; esac"
r = ":reset-diff-change"
# Space v h floats every commit that changed the selected lines, newest first, with each diff. q closes it.
# The line numbers are those of the last commit, so uncommitted edits above the lines shift them.
# LESS=R replaces git's FRX: without F, less stays open when the history fits on one screen.
# ponytail: the inner sh splits the path again, so a path with a space or a quote fails. Quote it if that happens.
h = ":sh rex do popup cmd='LESS=R git log -L %{selection_line_start},%{selection_line_end}:%{buffer_name}'"

[keys.select.space.v]
h = ":sh rex do popup cmd='LESS=R git log -L %{selection_line_start},%{selection_line_end}:%{buffer_name}'"

[keys.select.space.t]
e = ":pipe-to awk 1 | rex send -b REPL 2>/dev/null"
a = ":sh printf '@%%s:%%s-%%s ' %{buffer_name} %{selection_line_start} %{selection_line_end} | rex send -b agent 2>/dev/null && rex focus agent"
