theme = "baked"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
mouse = false
auto-format = true
popup-border = "all"
bufferline = "multiple"
end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true

# Zellij must send focus events to the pane. Otherwise focus-lost never fires.
[editor.auto-save]
focus-lost = true

[editor.statusline]
separator = "│"
mode.normal = "nor"
mode.insert = "ins"
mode.select = "sel"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false

# Space t r reloads buffers after the agent pane edits files. Helix does not reload them automatically.
[keys.normal.space.t]
e = ":pipe-to reple eval"
r = ":reload-all"
l = ["extend_to_line_bounds", ":pipe-to reple eval"]
# Copies @file:start-end of the selection for pasting into the agent pane. Helix has no IDE integration.
y = ":sh printf '@%%s:%%s-%%s' %{buffer_name} %{selection_line_start} %{selection_line_end} | pbcopy"

[keys.normal.space.v]
b = ":sh git blame --date=relative -L %{cursor_line},+1 -- %{buffer_name}"
r = ":reset-diff-change"
g = ":sh zellij run --floating --close-on-exit -x 3%% -y 3%% --width 94%% --height 94%% -- gitu"
l = ":sh zellij run --floating --close-on-exit -x 3%% -y 3%% --width 94%% --height 94%% -- lazygit"

[keys.select.space.t]
e = ":pipe-to reple eval"
