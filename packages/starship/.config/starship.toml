format = """
$username\
$hostname\
$container\
$shlvl\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$status\
$shell\
$character"""

[container]
format = '[$symbol]($style) '

# Bracketed plain-text segments: [dotfiles] [main] [!?] >
[directory]
format = '\[[$path]($style)[$read_only]($read_only_style)\] '
read_only = ' ro'

[git_branch]
format = '\[[$branch]($style)\] '

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
format = '\[[$duration]($style)\] '

[character]
success_symbol = '[>](bold)'
error_symbol = '[>](bold red)'
vimcmd_symbol = '[<](bold)'
