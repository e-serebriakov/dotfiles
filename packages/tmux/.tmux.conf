set -ga update-environment " COLORTERM"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-overrides ",*:RGB"

# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

set -g renumber-windows on
set -g allow-passthrough on
set -g set-clipboard on

# Change prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane splitting (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
# C-h/j/k/l without prefix: navigates tmux panes in non-vim panes,
# forwards to nvim when vim is focused (nvim handles splits internally).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Prefix + h/j/k/l: always navigates tmux panes (even from inside nvim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status line
set -g status-style bg=#eeeeee,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bold,fg=black,bg=#c6f3c5] #I:#W #[default]"

# Popups
bind C-l display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"

# List of plugins (must be before TPM init)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'b0o/tmux-autoreload'

# Initialize TPM (keep at the very bottom)
run-shell ~/.tmux/plugins/tpm/tpm

set-option -g default-shell /bin/zsh
set-option -g default-command "/bin/zsh -l"
