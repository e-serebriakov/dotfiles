# Lazydocker reads ~/Library/Application Support/jesseduffield/lazydocker on macOS.
# The colors use ANSI names from the terminal palette. Thus, they use the active theme colors.
gui:
  theme:
    # Each ANSI slot uses a dark color in the light themes. A colored row background can hide the text.
    # Reverse video keeps each cell readable with all palette colors.
    selectedLineBgColor:
      - reverse
    # Use a dark border for the focused panel, as in Zellij and Neovim.
    activeBorderColor:
      - black
      - bold
    optionsTextColor:
      - default
