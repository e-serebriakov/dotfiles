# The adjacent mise.lock fixes tool versions for repeatable installation.
# mise reads it automatically. install.sh uses --locked to require it.
# Do not require lockfiles globally: projects without a lockfile would fail.

[tools]
node = "24"
python = "3.12"
uv = "latest"
babashka = "latest"

neovim = "latest"
helix = "latest"
zellij = "0.44.1" # 0.45.1 breaks stacked panes, which work.kdl relies on
starship = "latest"

fzf = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
jq = "latest"
zoxide = "latest"

gh = "latest"
git-town = "latest"
delta = "latest"

just = "latest"
lazydocker = "latest"
direnv = "latest"
actionlint = "latest"
shellcheck = "latest"
k9s = "latest"
bottom = "latest" # btop has no macOS build
claude = "latest"
codex = "latest"
pi = "latest"

"github:achristmascarl/rainfrog" = "latest" # no registry entry

"npm:ccstatusline" = "2.2.30" # Claude Code statusline
"npm:markdownlint-cli2" = "latest"
"npm:@fsouza/prettierd" = "latest" # yaml/html format
