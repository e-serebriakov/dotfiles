# The adjacent mise.lock fixes tool versions for repeatable installation.
# mise reads it automatically. install.sh uses --locked so installation must use it.
# Do not make lockfiles mandatory for all projects. Projects without a lockfile cannot install their tools with that setting.

[tools]
node = "24.22.3"
python = "3.12.13"
uv = "0.11.15"
babashka = "1.13.230"

neovim = "0.12.6"
helix = "25.07.1"
tree-sitter = "0.27.2" # nvim-treesitter's main branch compiles parsers with it
starship = "1.27.0"

fzf = "0.75.0"
ripgrep = "16.0.0"
fd = "10.5.2"
bat = "0.26.1"
eza = "0.23.5"
jq = "1.8.2"
zoxide = "0.10.0"

gh = "2.105.0"
git-town = "24.2.0"
gitu = { version = "0.44.0", os = ["macos", "linux/x64"] } # no linux-arm64 release

just = "1.59.0"
lazydocker = "0.25.2"
direnv = "2.38.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
shfmt = "3.14.1" # bash formatter for Helix
k9s = "0.51.0"
mermaid-ascii = "1.6.2" # Mermaid as text in agent replies
bottom = "0.15.0" # btop has no macOS build
claude = "2.1.331"
codex = "0.172.0"
pi = "1.6.0"

"github:achristmascarl/rainfrog" = "0.4.7" # no registry entry

"npm:markdownlint-cli2" = "0.24.2"
"npm:@fsouza/prettierd" = "0.29.0" # yaml/html format

# Language servers for Helix in any project. Neovim installs its own through Mason.
marksman = "2026-02-08"
taplo = "0.10.0"
"npm:bash-language-server" = "5.8.1"
"npm:yaml-language-server" = "1.25.0"
"npm:vscode-langservers-extracted" = "4.10.0" # json, css, html
"npm:typescript-language-server" = "6.1.0" # uses the project's node_modules/typescript
